<svg class="fsd" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 1275" width="1030" height="1275" style="max-width: 100%; height: auto" role="img" aria-label="A gc session">
  <!--
    Sequence diagram for docs/fs-store-file-deletes-scenarios.md.
    Time runs down. Lanes are lifelines, slanted arrows are messages:
    indigo = message to or from the metadata actor (dashed = reply),
    slate = file IO of the entity, rose = file delete, amber = live/parked state.
    Boxes are steps an actor takes, metadata boxes are one batch.
  -->
  <style>
    /* dark palette: rustdoc dark and ayu themes, or prefers-color-scheme when standalone */
    :root[data-theme="dark"] .fsd [fill="#f3f4f6"], :root[data-theme="ayu"] .fsd [fill="#f3f4f6"] { fill: #1f2430 }
    :root[data-theme="dark"] .fsd [fill="#fff"], :root[data-theme="ayu"] .fsd [fill="#fff"] { fill: #11141b }
    :root[data-theme="dark"] .fsd [fill="#374151"], :root[data-theme="ayu"] .fsd [fill="#374151"] { fill: #e5e7eb }
    :root[data-theme="dark"] .fsd [fill="#888"], :root[data-theme="ayu"] .fsd [fill="#888"] { fill: #9ca3af }
    :root[data-theme="dark"] .fsd [fill="#9ca3af"], :root[data-theme="ayu"] .fsd [fill="#9ca3af"] { fill: #6b7280 }
    :root[data-theme="dark"] .fsd [fill="#6366f1"], :root[data-theme="ayu"] .fsd [fill="#6366f1"] { fill: #818cf8 }
    :root[data-theme="dark"] .fsd [fill="#d97706"], :root[data-theme="ayu"] .fsd [fill="#d97706"] { fill: #fbbf24 }
    :root[data-theme="dark"] .fsd [fill="#e11d48"], :root[data-theme="ayu"] .fsd [fill="#e11d48"] { fill: #fb7185 }
    :root[data-theme="dark"] .fsd [fill="#475569"], :root[data-theme="ayu"] .fsd [fill="#475569"] { fill: #94a3b8 }
    :root[data-theme="dark"] .fsd [stroke="#f3f4f6"], :root[data-theme="ayu"] .fsd [stroke="#f3f4f6"] { stroke: #1f2430 }
    :root[data-theme="dark"] .fsd [stroke="#fff"], :root[data-theme="ayu"] .fsd [stroke="#fff"] { stroke: #11141b }
    :root[data-theme="dark"] .fsd [stroke="#374151"], :root[data-theme="ayu"] .fsd [stroke="#374151"] { stroke: #e5e7eb }
    :root[data-theme="dark"] .fsd [stroke="#888"], :root[data-theme="ayu"] .fsd [stroke="#888"] { stroke: #9ca3af }
    :root[data-theme="dark"] .fsd [stroke="#9ca3af"], :root[data-theme="ayu"] .fsd [stroke="#9ca3af"] { stroke: #6b7280 }
    :root[data-theme="dark"] .fsd [stroke="#6366f1"], :root[data-theme="ayu"] .fsd [stroke="#6366f1"] { stroke: #818cf8 }
    :root[data-theme="dark"] .fsd [stroke="#d97706"], :root[data-theme="ayu"] .fsd [stroke="#d97706"] { stroke: #fbbf24 }
    :root[data-theme="dark"] .fsd [stroke="#e11d48"], :root[data-theme="ayu"] .fsd [stroke="#e11d48"] { stroke: #fb7185 }
    :root[data-theme="dark"] .fsd [stroke="#475569"], :root[data-theme="ayu"] .fsd [stroke="#475569"] { stroke: #94a3b8 }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#f3f4f6"], .fsd:root [fill="#f3f4f6"] { fill: #1f2430 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#fff"], .fsd:root [fill="#fff"] { fill: #11141b }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#374151"], .fsd:root [fill="#374151"] { fill: #e5e7eb }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#888"], .fsd:root [fill="#888"] { fill: #9ca3af }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#9ca3af"], .fsd:root [fill="#9ca3af"] { fill: #6b7280 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#6366f1"], .fsd:root [fill="#6366f1"] { fill: #818cf8 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#d97706"], .fsd:root [fill="#d97706"] { fill: #fbbf24 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#e11d48"], .fsd:root [fill="#e11d48"] { fill: #fb7185 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#475569"], .fsd:root [fill="#475569"] { fill: #94a3b8 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#f3f4f6"], .fsd:root [stroke="#f3f4f6"] { stroke: #1f2430 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#fff"], .fsd:root [stroke="#fff"] { stroke: #11141b }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#374151"], .fsd:root [stroke="#374151"] { stroke: #e5e7eb }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#888"], .fsd:root [stroke="#888"] { stroke: #9ca3af }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#9ca3af"], .fsd:root [stroke="#9ca3af"] { stroke: #6b7280 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#6366f1"], .fsd:root [stroke="#6366f1"] { stroke: #818cf8 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#d97706"], .fsd:root [stroke="#d97706"] { stroke: #fbbf24 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#e11d48"], .fsd:root [stroke="#e11d48"] { stroke: #fb7185 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#475569"], .fsd:root [stroke="#475569"] { stroke: #94a3b8 }
    }
  </style>
  <defs>
    <marker id="fs-gc-run-msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-gc-run-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-gc-run-file" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="fs-gc-run-rm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
  </defs>
  <rect x="0" y="0" width="1030" height="1275" rx="12" fill="#f3f4f6"/>
  <text x="515" y="28" text-anchor="middle" font-family="'Space Mono', monospace" font-size="13" fill="#6366f1">A gc session</text>
  <line x1="22" y1="60" x2="22" y2="1255" stroke="#9ca3af" stroke-width="1" marker-end="url(#fs-gc-run-axis)"/>
  <defs><marker id="fs-gc-run-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <text x="22" y="54" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#888">t</text>
  <line x1="150" y1="74" x2="150" y2="1259" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="108" y="46" width="84" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="150" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">entity r</text>
  <line x1="350" y1="74" x2="350" y2="1259" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="286" y="46" width="128" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="350" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">metadata actor</text>
  <line x1="560" y1="74" x2="560" y2="1259" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="511" y="46" width="98" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="560" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">main actor</text>
  <line x1="750" y1="74" x2="750" y2="1259" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="731" y="46" width="39" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="750" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">gc</text>
  <line x1="920" y1="74" x2="920" y2="1259" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="886" y="46" width="69" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="920" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">client</text>
  <!-- GcRun -->
  <line x1="747" y1="110" x2="564" y2="118" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-gc-run-msg)"/>
  <text x="655" y="104" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">GcRun</text>
  <rect x="464" y="138" width="191" height="42" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="560" y="158" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">start_gc_run</text>
  <text x="560" y="173" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">from now: tag ops deferred</text>
  <!-- Snapshot -->
  <line x1="557" y1="216" x2="354" y2="224" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-gc-run-msg)"/>
  <text x="455" y="210" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Snapshot</text>
  <text x="455" y="239" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">earlier tag ops commit first</text>
  <!-- read-only tables -->
  <line x1="353" y1="266" x2="556" y2="274" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-gc-run-reply)"/>
  <text x="455" y="260" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">read-only tables</text>
  <rect x="477" y="294" width="165" height="42" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="560" y="314" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">candidates: all blobs</text>
  <text x="560" y="329" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">roots: tags, temp tags</text>
  <!-- freeze_entry -->
  <line x1="557" y1="372" x2="154" y2="380" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-gc-run-msg)"/>
  <text x="250" y="366" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">freeze_entry</text>
  <text x="250" y="395" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">r is a HashSeq root</text>
  <rect x="90" y="408" width="120" height="42" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="150" y="428" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">load</text>
  <text x="150" y="443" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">Frozen(Partial)</text>
  <!-- ack -->
  <line x1="153" y1="486" x2="556" y2="494" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-gc-run-reply)"/>
  <text x="455" y="480" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">ack</text>
  <!-- GcSnapshot -->
  <line x1="563" y1="528" x2="746" y2="536" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-gc-run-reply)"/>
  <text x="655" y="522" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">GcSnapshot</text>
  <text x="655" y="551" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">after every ack</text>
  <rect x="674" y="564" width="152" height="57" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="750" y="584" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">mark: read roots,</text>
  <text x="750" y="599" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">r&#x27;s available chunks</text>
  <text x="750" y="614" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">protect callback</text>
  <!-- set tag / import done -->
  <line x1="917" y1="657" x2="564" y2="665" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-gc-run-msg)"/>
  <text x="655" y="651" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">set tag / import done</text>
  <rect x="523" y="685" width="74" height="27" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="560" y="705" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">deferred</text>
  <!-- next chunk of r -->
  <line x1="917" y1="748" x2="154" y2="756" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-gc-run-msg)"/>
  <text x="250" y="742" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">next chunk of r</text>
  <text x="250" y="771" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">via the main actor</text>
  <rect x="54" y="784" width="191" height="42" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="150" y="804" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">write_batch: wait_writable</text>
  <text x="150" y="819" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">waits</text>
  <!-- DeleteBlobs(garbage) -->
  <line x1="747" y1="862" x2="564" y2="870" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-gc-run-msg)"/>
  <text x="655" y="856" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">DeleteBlobs(garbage)</text>
  <text x="655" y="885" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">sweep: candidates - live</text>
  <!-- Ok -->
  <line x1="563" y1="912" x2="746" y2="920" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-gc-run-reply)"/>
  <text x="655" y="906" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Ok</text>
  <text x="655" y="935" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">see the delete diagrams</text>
  <!-- drop the GcRun channel -->
  <line x1="747" y1="962" x2="564" y2="970" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-gc-run-msg)"/>
  <text x="655" y="956" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">drop the GcRun channel</text>
  <rect x="516" y="990" width="87" height="27" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="560" y="1010" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">end_gc_run</text>
  <!-- drop the release channel -->
  <line x1="557" y1="1053" x2="154" y2="1061" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-gc-run-msg)"/>
  <text x="250" y="1047" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">drop the release channel</text>
  <rect x="58" y="1081" width="185" height="57" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="150" y="1101" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">freeze task restores</text>
  <text x="150" y="1116" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">Partial</text>
  <text x="150" y="1131" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">the waiting write goes on</text>
  <rect x="484" y="1160" width="152" height="27" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="560" y="1180" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">run deferred tag ops</text>
  <!-- Ok -->
  <line x1="563" y1="1223" x2="916" y2="1231" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-gc-run-reply)"/>
  <text x="835" y="1217" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Ok</text>
</svg>
