<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 876" width="1010" height="876" style="max-width: 100%; height: auto" role="img" aria-label="Deleting an idle entry">
  <!--
    Sequence diagram for docs/fs-store-file-deletes-scenarios.md.
    Time runs down. Lanes are lifelines, slanted arrows are messages:
    indigo = message to or from the metadata actor (dashed = reply),
    slate = file IO of the entity, rose = file delete, amber = live/parked state.
    Boxes are steps an actor takes, metadata boxes are one batch.
  -->
  <defs>
    <marker id="fs-delete-idle-msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-delete-idle-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-delete-idle-file" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="fs-delete-idle-rm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
  </defs>
  <rect x="0" y="0" width="1010" height="876" rx="12" fill="#f3f4f6"/>
  <text x="505" y="28" text-anchor="middle" font-family="'Space Mono', monospace" font-size="13" fill="#6366f1">Deleting an idle entry</text>
  <line x1="22" y1="60" x2="22" y2="856" stroke="#9ca3af" stroke-width="1" marker-end="url(#fs-delete-idle-axis)"/>
  <defs><marker id="fs-delete-idle-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <text x="22" y="54" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#888">t</text>
  <line x1="100" y1="74" x2="100" y2="860" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="51" y="46" width="98" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="100" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">files of h</text>
  <line x1="300" y1="74" x2="300" y2="860" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="258" y="46" width="84" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="300" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">entity h</text>
  <line x1="510" y1="74" x2="510" y2="860" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="446" y="46" width="128" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="510" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">metadata actor</text>
  <line x1="720" y1="74" x2="720" y2="860" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="671" y="46" width="98" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="720" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">main actor</text>
  <line x1="900" y1="74" x2="900" y2="860" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="881" y="46" width="39" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="900" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">gc</text>
  <!-- DeleteBlobs(h) -->
  <line x1="897" y1="110" x2="724" y2="118" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-delete-idle-msg)"/>
  <text x="810" y="104" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">DeleteBlobs(h)</text>
  <rect x="631" y="138" width="178" height="57" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="720" y="158" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">no temp tag protects h</text>
  <text x="720" y="173" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">spawn delete on entity h</text>
  <text x="720" y="188" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">(created, not loaded)</text>
  <!-- delete_entry -->
  <line x1="717" y1="231" x2="304" y2="239" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-delete-idle-msg)"/>
  <text x="405" y="225" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">delete_entry</text>
  <rect x="224" y="259" width="152" height="57" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="300" y="279" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">delete count + 1</text>
  <text x="300" y="294" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">Deleting</text>
  <text x="300" y="309" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">no cached state kept</text>
  <!-- Delete(h) -->
  <line x1="303" y1="352" x2="506" y2="360" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-delete-idle-msg)"/>
  <text x="405" y="346" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Delete(h)</text>
  <text x="405" y="375" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">waits until applied</text>
  <rect x="418" y="388" width="185" height="27" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="510" y="408" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">write batch: remove entry</text>
  <!-- Ok -->
  <line x1="507" y1="451" x2="304" y2="459" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-delete-idle-reply)"/>
  <text x="405" y="445" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Ok</text>
  <text x="405" y="474" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">applied, not committed</text>
  <rect x="227" y="487" width="146" height="27" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="300" y="507" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">wait for the notice</text>
  <rect x="479" y="536" width="61" height="27" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="510" y="556" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">commit</text>
  <!-- FileNotice(h, deleted) -->
  <line x1="513" y1="599" x2="716" y2="607" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-delete-idle-msg)"/>
  <text x="615" y="593" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">FileNotice(h, deleted)</text>
  <!-- notice into its inbox -->
  <line x1="717" y1="641" x2="304" y2="649" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-delete-idle-msg)"/>
  <text x="405" y="635" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">notice into its inbox</text>
  <!-- rm all four files -->
  <line x1="297" y1="683" x2="104" y2="691" stroke="#e11d48" stroke-width="1.5" marker-end="url(#fs-delete-idle-rm)"/>
  <text x="200" y="677" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#e11d48">rm all four files</text>
  <rect x="253" y="711" width="94" height="27" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="300" y="731" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">NonExisting</text>
  <!-- Ok -->
  <line x1="303" y1="774" x2="716" y2="782" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-delete-idle-reply)"/>
  <text x="615" y="768" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Ok</text>
  <!-- Ok -->
  <line x1="723" y1="816" x2="896" y2="824" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-delete-idle-reply)"/>
  <text x="810" y="810" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Ok</text>
  <text x="810" y="839" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">after the unlink attempts</text>
</svg>
