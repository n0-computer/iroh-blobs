<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 852" width="870" height="852" style="max-width: 100%; height: auto" role="img" aria-label="A read-loaded entity writes after a delete">
  <!--
    Sequence diagram for docs/fs-store-file-deletes-scenarios.md.
    Time runs down. Lanes are lifelines, slanted arrows are messages:
    indigo = message to or from the metadata actor (dashed = reply),
    slate = file IO of the entity, rose = file delete, amber = live/parked state.
    Boxes are steps an actor takes, metadata boxes are one batch.
  -->
  <defs>
    <marker id="fs-read-then-write-msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-read-then-write-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-read-then-write-file" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="fs-read-then-write-rm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
  </defs>
  <rect x="0" y="0" width="870" height="852" rx="12" fill="#f3f4f6"/>
  <text x="435" y="28" text-anchor="middle" font-family="'Space Mono', monospace" font-size="13" fill="#6366f1">A read-loaded entity writes after a delete</text>
  <line x1="22" y1="60" x2="22" y2="832" stroke="#9ca3af" stroke-width="1" marker-end="url(#fs-read-then-write-axis)"/>
  <defs><marker id="fs-read-then-write-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <text x="22" y="54" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#888">t</text>
  <line x1="100" y1="74" x2="100" y2="836" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="51" y="46" width="98" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="100" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">files of h</text>
  <line x1="310" y1="74" x2="310" y2="836" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="268" y="46" width="84" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="310" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">entity h</text>
  <line x1="550" y1="74" x2="550" y2="836" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="486" y="46" width="128" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">metadata actor</text>
  <line x1="760" y1="74" x2="760" y2="836" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="741" y="46" width="39" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="760" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">gc</text>
  <!-- Get(h, Read) -->
  <line x1="313" y1="110" x2="546" y2="118" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-read-then-write-msg)"/>
  <text x="430" y="104" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Get(h, Read)</text>
  <rect x="490" y="138" width="120" height="57" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="158" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">read batch</text>
  <text x="550" y="173" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">entry: Complete</text>
  <text x="550" y="188" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">not marked live</text>
  <!-- Complete, marked: false -->
  <line x1="547" y1="231" x2="314" y2="239" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-read-then-write-reply)"/>
  <text x="430" y="225" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Complete, marked: false</text>
  <!-- DeleteBlobs(h) -->
  <line x1="757" y1="273" x2="554" y2="281" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-read-then-write-msg)"/>
  <text x="655" y="267" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">DeleteBlobs(h)</text>
  <rect x="458" y="301" width="185" height="57" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="321" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">write batch: remove entry</text>
  <text x="550" y="336" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">commit</text>
  <text x="550" y="351" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">h not live: delete now</text>
  <!-- rm data, outboard -->
  <line x1="547" y1="394" x2="104" y2="402" stroke="#e11d48" stroke-width="1.5" marker-end="url(#fs-read-then-write-rm)"/>
  <text x="205" y="388" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#e11d48">rm data, outboard</text>
  <rect x="211" y="422" width="198" height="57" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="310" y="442" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">import of h arrives</text>
  <text x="310" y="457" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">load_for_write: ensure_live</text>
  <text x="310" y="472" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">holds stale state Complete</text>
  <!-- Get(h, Write) -->
  <line x1="313" y1="515" x2="546" y2="523" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-read-then-write-msg)"/>
  <text x="430" y="509" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Get(h, Write)</text>
  <text x="430" y="538" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">first write after a read load</text>
  <rect x="503" y="551" width="94" height="57" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="571" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">read batch</text>
  <text x="550" y="586" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">entry: none</text>
  <text x="550" y="601" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">live {h}</text>
  <!-- None, marked: true -->
  <line x1="547" y1="644" x2="314" y2="652" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-read-then-write-reply)"/>
  <text x="430" y="638" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">None, marked: true</text>
  <rect x="208" y="672" width="204" height="42" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="310" y="692" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">state differs from Complete:</text>
  <text x="310" y="707" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">reopen as NonExisting</text>
  <!-- write fresh files -->
  <line x1="307" y1="750" x2="104" y2="758" stroke="#475569" stroke-width="1.5" marker-end="url(#fs-read-then-write-file)"/>
  <text x="205" y="744" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#475569">write fresh files</text>
  <!-- Update(h, …) -->
  <line x1="313" y1="792" x2="546" y2="800" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-read-then-write-msg)"/>
  <text x="430" y="786" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Update(h, …)</text>
  <text x="430" y="815" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">continues as in the write scenario</text>
</svg>
