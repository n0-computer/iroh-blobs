<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 861" width="660" height="861" style="max-width: 100%; height: auto" role="img" aria-label="Writing: an entity downloads a blob">
  <!--
    Sequence diagram for docs/fs-store-file-deletes-scenarios.md.
    Time runs down. Lanes are lifelines, slanted arrows are messages:
    indigo = message to or from the metadata actor (dashed = reply),
    slate = file IO of the entity, rose = file delete, amber = live/parked state.
    Boxes are steps an actor takes, metadata boxes are one batch.
  -->
  <defs>
    <marker id="fs-write-msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-write-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-write-file" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="fs-write-rm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="861" rx="12" fill="#f3f4f6"/>
  <text x="330" y="28" text-anchor="middle" font-family="'Space Mono', monospace" font-size="13" fill="#6366f1">Writing: an entity downloads a blob</text>
  <line x1="22" y1="60" x2="22" y2="841" stroke="#9ca3af" stroke-width="1" marker-end="url(#fs-write-axis)"/>
  <defs><marker id="fs-write-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <text x="22" y="54" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#888">t</text>
  <line x1="100" y1="74" x2="100" y2="845" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="51" y="46" width="98" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="100" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">files of h</text>
  <line x1="310" y1="74" x2="310" y2="845" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="268" y="46" width="84" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="310" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">entity h</text>
  <line x1="550" y1="74" x2="550" y2="845" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="486" y="46" width="128" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">metadata actor</text>
  <!-- Get(h, Write) -->
  <line x1="313" y1="110" x2="546" y2="118" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-write-msg)"/>
  <text x="430" y="104" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Get(h, Write)</text>
  <rect x="503" y="138" width="94" height="57" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="158" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">read batch</text>
  <text x="550" y="173" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">entry: none</text>
  <text x="550" y="188" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">live {h}</text>
  <!-- None, marked: true -->
  <line x1="547" y1="231" x2="314" y2="239" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-write-reply)"/>
  <text x="430" y="225" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">None, marked: true</text>
  <!-- write data, outboard, sizes -->
  <line x1="307" y1="273" x2="104" y2="281" stroke="#475569" stroke-width="1.5" marker-end="url(#fs-write-file)"/>
  <text x="205" y="267" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#475569">write data, outboard, sizes</text>
  <!-- Update(h, Partial) -->
  <line x1="313" y1="315" x2="546" y2="323" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-write-msg)"/>
  <text x="430" y="309" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Update(h, Partial)</text>
  <text x="430" y="338" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">does not wait</text>
  <rect x="464" y="351" width="172" height="42" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="371" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">write batch, commit</text>
  <text x="550" y="386" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">h written, live: park h</text>
  <rect x="92" y="415" width="16" height="16" fill="#f3f4f6"/>
  <text x="100" y="427" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#9ca3af">…</text>
  <rect x="302" y="415" width="16" height="16" fill="#f3f4f6"/>
  <text x="310" y="427" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#9ca3af">…</text>
  <rect x="542" y="415" width="16" height="16" fill="#f3f4f6"/>
  <text x="550" y="427" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#9ca3af">…</text>
  <!-- write the last chunks -->
  <line x1="307" y1="453" x2="104" y2="461" stroke="#475569" stroke-width="1.5" marker-end="url(#fs-write-file)"/>
  <text x="205" y="447" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#475569">write the last chunks</text>
  <!-- Update(h, Complete) -->
  <line x1="313" y1="495" x2="546" y2="503" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-write-msg)"/>
  <text x="430" y="489" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Update(h, Complete)</text>
  <rect x="474" y="523" width="152" height="42" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="543" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">write batch, commit</text>
  <text x="550" y="558" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">h live: stays parked</text>
  <rect x="244" y="587" width="133" height="42" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="310" y="607" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">idle: on_shutdown</text>
  <text x="310" y="622" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">persist</text>
  <!-- Inactive(h) -->
  <line x1="313" y1="665" x2="546" y2="673" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-write-msg)"/>
  <text x="430" y="659" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Inactive(h)</text>
  <text x="430" y="688" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">after all file and meta writes</text>
  <rect x="458" y="701" width="185" height="72" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="721" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">live {}</text>
  <text x="550" y="736" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">next batch, read or write</text>
  <text x="550" y="751" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">parked h not live,</text>
  <text x="550" y="766" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">state Complete</text>
  <!-- rm sizes, bitfield -->
  <line x1="547" y1="809" x2="104" y2="817" stroke="#e11d48" stroke-width="1.5" marker-end="url(#fs-write-rm)"/>
  <text x="205" y="803" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#e11d48">rm sizes, bitfield</text>
</svg>
