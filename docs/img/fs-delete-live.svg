<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 696" width="870" height="696" style="max-width: 100%; height: auto" role="img" aria-label="Delete while the entity is live">
  <!--
    Sequence diagram for docs/fs-store-file-deletes-scenarios.md.
    Time runs down. Lanes are lifelines, slanted arrows are messages:
    indigo = message to or from the metadata actor (dashed = reply),
    slate = file IO of the entity, rose = file delete, amber = live/parked state.
    Boxes are steps an actor takes, metadata boxes are one batch.
  -->
  <defs>
    <marker id="fs-delete-live-msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-delete-live-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-delete-live-file" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="fs-delete-live-rm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
  </defs>
  <rect x="0" y="0" width="870" height="696" rx="12" fill="#f3f4f6"/>
  <text x="435" y="28" text-anchor="middle" font-family="'Space Mono', monospace" font-size="13" fill="#6366f1">Delete while the entity is live</text>
  <line x1="22" y1="60" x2="22" y2="676" stroke="#9ca3af" stroke-width="1" marker-end="url(#fs-delete-live-axis)"/>
  <defs><marker id="fs-delete-live-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <text x="22" y="54" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#888">t</text>
  <line x1="100" y1="74" x2="100" y2="680" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="51" y="46" width="98" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="100" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">files of h</text>
  <line x1="310" y1="74" x2="310" y2="680" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="268" y="46" width="84" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="310" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">entity h</text>
  <line x1="550" y1="74" x2="550" y2="680" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="486" y="46" width="128" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">metadata actor</text>
  <line x1="760" y1="74" x2="760" y2="680" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="741" y="46" width="39" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="760" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">gc</text>
  <!-- Get(h, Read) -->
  <line x1="313" y1="110" x2="546" y2="118" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-delete-live-msg)"/>
  <text x="430" y="104" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Get(h, Read)</text>
  <text x="430" y="133" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">observe on a partial entry</text>
  <rect x="493" y="146" width="113" height="57" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="166" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">read batch</text>
  <text x="550" y="181" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">entry: Partial</text>
  <text x="550" y="196" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">live {h}</text>
  <!-- Partial, marked: true -->
  <line x1="547" y1="239" x2="314" y2="247" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-delete-live-reply)"/>
  <text x="430" y="233" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Partial, marked: true</text>
  <!-- open data, outboard, sizes -->
  <line x1="307" y1="281" x2="104" y2="289" stroke="#475569" stroke-width="1.5" marker-end="url(#fs-delete-live-file)"/>
  <text x="205" y="275" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#475569">open data, outboard, sizes</text>
  <!-- DeleteBlobs(h, force) -->
  <line x1="757" y1="323" x2="554" y2="331" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-delete-live-msg)"/>
  <text x="655" y="317" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">DeleteBlobs(h, force)</text>
  <rect x="454" y="351" width="191" height="57" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="371" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">write batch: remove entry</text>
  <text x="550" y="386" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">commit</text>
  <text x="550" y="401" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">h live: park h, keep files</text>
  <rect x="218" y="430" width="185" height="42" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="310" y="450" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">observer drops the stream</text>
  <text x="310" y="465" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">on_shutdown: persist</text>
  <!-- Inactive(h) -->
  <line x1="313" y1="508" x2="546" y2="516" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-delete-live-msg)"/>
  <text x="430" y="502" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Inactive(h)</text>
  <rect x="480" y="536" width="139" height="72" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="550" y="556" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">live {}</text>
  <text x="550" y="571" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">next batch</text>
  <text x="550" y="586" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">parked h not live,</text>
  <text x="550" y="601" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">no entry</text>
  <!-- rm data, outboard, sizes, bitfield -->
  <line x1="547" y1="644" x2="104" y2="652" stroke="#e11d48" stroke-width="1.5" marker-end="url(#fs-delete-live-rm)"/>
  <text x="205" y="638" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#e11d48">rm data, outboard, sizes, bitfield</text>
</svg>
