<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 795" width="1010" height="795" style="max-width: 100%; height: auto" role="img" aria-label="Re-import after a delete">
  <!--
    Sequence diagram for docs/fs-store-file-deletes-scenarios.md.
    Time runs down. Lanes are lifelines, slanted arrows are messages:
    indigo = message to or from the metadata actor (dashed = reply),
    slate = file IO of the entity, rose = file delete, amber = live/parked state.
    Boxes are steps an actor takes, metadata boxes are one batch.
  -->
  <defs>
    <marker id="fs-reimport-msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-reimport-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="fs-reimport-file" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="fs-reimport-rm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
  </defs>
  <rect x="0" y="0" width="1010" height="795" rx="12" fill="#f3f4f6"/>
  <text x="505" y="28" text-anchor="middle" font-family="'Space Mono', monospace" font-size="13" fill="#6366f1">Re-import after a delete</text>
  <line x1="22" y1="60" x2="22" y2="775" stroke="#9ca3af" stroke-width="1" marker-end="url(#fs-reimport-axis)"/>
  <defs><marker id="fs-reimport-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <text x="22" y="54" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#888">t</text>
  <line x1="100" y1="74" x2="100" y2="779" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="51" y="46" width="98" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="100" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">files of h</text>
  <line x1="300" y1="74" x2="300" y2="779" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="258" y="46" width="84" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="300" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">entity h</text>
  <line x1="510" y1="74" x2="510" y2="779" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="446" y="46" width="128" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="510" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">metadata actor</text>
  <line x1="720" y1="74" x2="720" y2="779" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="671" y="46" width="98" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="720" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">main actor</text>
  <line x1="900" y1="74" x2="900" y2="779" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="866" y="46" width="69" height="28" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="900" y="64" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#6366f1">client</text>
  <!-- Get(h) -->
  <line x1="303" y1="110" x2="506" y2="118" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-reimport-msg)"/>
  <text x="405" y="104" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Get(h)</text>
  <text x="405" y="133" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">a reader loads the entity</text>
  <!-- Complete -->
  <line x1="507" y1="160" x2="304" y2="168" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-reimport-reply)"/>
  <text x="405" y="154" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Complete</text>
  <!-- DeleteBlobs(h, force) -->
  <line x1="897" y1="202" x2="724" y2="210" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-reimport-msg)"/>
  <text x="810" y="196" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">DeleteBlobs(h, force)</text>
  <!-- delete_entry -->
  <line x1="717" y1="244" x2="304" y2="252" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-reimport-msg)"/>
  <text x="405" y="238" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">delete_entry</text>
  <!-- Delete(h) -->
  <line x1="303" y1="286" x2="506" y2="294" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-reimport-msg)"/>
  <text x="405" y="280" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Delete(h)</text>
  <!-- Ok -->
  <line x1="507" y1="328" x2="304" y2="336" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#fs-reimport-reply)"/>
  <text x="405" y="322" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Ok</text>
  <!-- FileNotice(h, deleted) -->
  <line x1="513" y1="370" x2="716" y2="378" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-reimport-msg)"/>
  <text x="615" y="364" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">FileNotice(h, deleted)</text>
  <text x="615" y="393" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#888">after the commit</text>
  <!-- notice into its inbox -->
  <line x1="717" y1="420" x2="304" y2="428" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-reimport-msg)"/>
  <text x="405" y="414" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">notice into its inbox</text>
  <!-- rm all four files -->
  <line x1="297" y1="462" x2="104" y2="470" stroke="#e11d48" stroke-width="1.5" marker-end="url(#fs-reimport-rm)"/>
  <text x="200" y="456" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#e11d48">rm all four files</text>
  <rect x="182" y="490" width="237" height="27" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="300" y="510" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">NonExisting, not a stale Complete</text>
  <!-- import h -->
  <line x1="897" y1="553" x2="724" y2="561" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-reimport-msg)"/>
  <text x="810" y="547" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">import h</text>
  <!-- finish_import -->
  <line x1="717" y1="595" x2="304" y2="603" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-reimport-msg)"/>
  <text x="405" y="589" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">finish_import</text>
  <rect x="191" y="623" width="217" height="42" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/>
  <text x="300" y="643" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">wait_settled</text>
  <text x="300" y="658" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10.5" fill="#374151">state NonExisting: not a no-op</text>
  <!-- rename temp file to data/h -->
  <line x1="297" y1="701" x2="104" y2="709" stroke="#475569" stroke-width="1.5" marker-end="url(#fs-reimport-file)"/>
  <text x="200" y="695" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#475569">rename temp file to data/h</text>
  <!-- Update(h, Complete) -->
  <line x1="303" y1="743" x2="506" y2="751" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-reimport-msg)"/>
  <text x="405" y="737" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#6366f1">Update(h, Complete)</text>
</svg>
