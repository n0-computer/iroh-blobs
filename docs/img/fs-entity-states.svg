<svg class="fsd" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 725" width="860" height="725" style="max-width: 100%; height: auto" role="img" aria-label="State machine of an fs store entity">
  <!--
    State machine of BaoFileStorage, the state of an fs store entity, for
    the store::fs module docs.
    Must match src/store/fs.rs and src/store/fs/bao_file.rs, update together.
    Layout: states are 150 x 50 boxes in three rows (y = 130, 330, 530) at
    x = 80, 355, 630. The dashed box groups the loaded states. Transitions are
    indigo, guards are in brackets.
  -->
  <style>
    /* dark palette: rustdoc dark and ayu themes, or prefers-color-scheme when standalone */
    :root[data-theme="dark"] .fsd [fill="#f3f4f6"], :root[data-theme="ayu"] .fsd [fill="#f3f4f6"] { fill: #1f2430 }
    :root[data-theme="dark"] .fsd [fill="#fff"], :root[data-theme="ayu"] .fsd [fill="#fff"] { fill: #11141b }
    :root[data-theme="dark"] .fsd [fill="#374151"], :root[data-theme="ayu"] .fsd [fill="#374151"] { fill: #e5e7eb }
    :root[data-theme="dark"] .fsd [fill="#888"], :root[data-theme="ayu"] .fsd [fill="#888"] { fill: #9ca3af }
    :root[data-theme="dark"] .fsd [fill="#9ca3af"], :root[data-theme="ayu"] .fsd [fill="#9ca3af"] { fill: #6b7280 }
    :root[data-theme="dark"] .fsd [fill="#6366f1"], :root[data-theme="ayu"] .fsd [fill="#6366f1"] { fill: #818cf8 }
    :root[data-theme="dark"] .fsd [fill="#d97706"], :root[data-theme="ayu"] .fsd [fill="#d97706"] { fill: #fbbf24 }
    :root[data-theme="dark"] .fsd [fill="#e11d48"], :root[data-theme="ayu"] .fsd [fill="#e11d48"] { fill: #fb7185 }
    :root[data-theme="dark"] .fsd [fill="#475569"], :root[data-theme="ayu"] .fsd [fill="#475569"] { fill: #94a3b8 }
    :root[data-theme="dark"] .fsd [stroke="#f3f4f6"], :root[data-theme="ayu"] .fsd [stroke="#f3f4f6"] { stroke: #1f2430 }
    :root[data-theme="dark"] .fsd [stroke="#fff"], :root[data-theme="ayu"] .fsd [stroke="#fff"] { stroke: #11141b }
    :root[data-theme="dark"] .fsd [stroke="#374151"], :root[data-theme="ayu"] .fsd [stroke="#374151"] { stroke: #e5e7eb }
    :root[data-theme="dark"] .fsd [stroke="#888"], :root[data-theme="ayu"] .fsd [stroke="#888"] { stroke: #9ca3af }
    :root[data-theme="dark"] .fsd [stroke="#9ca3af"], :root[data-theme="ayu"] .fsd [stroke="#9ca3af"] { stroke: #6b7280 }
    :root[data-theme="dark"] .fsd [stroke="#6366f1"], :root[data-theme="ayu"] .fsd [stroke="#6366f1"] { stroke: #818cf8 }
    :root[data-theme="dark"] .fsd [stroke="#d97706"], :root[data-theme="ayu"] .fsd [stroke="#d97706"] { stroke: #fbbf24 }
    :root[data-theme="dark"] .fsd [stroke="#e11d48"], :root[data-theme="ayu"] .fsd [stroke="#e11d48"] { stroke: #fb7185 }
    :root[data-theme="dark"] .fsd [stroke="#475569"], :root[data-theme="ayu"] .fsd [stroke="#475569"] { stroke: #94a3b8 }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#f3f4f6"], .fsd:root [fill="#f3f4f6"] { fill: #1f2430 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#fff"], .fsd:root [fill="#fff"] { fill: #11141b }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#374151"], .fsd:root [fill="#374151"] { fill: #e5e7eb }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#888"], .fsd:root [fill="#888"] { fill: #9ca3af }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#9ca3af"], .fsd:root [fill="#9ca3af"] { fill: #6b7280 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#6366f1"], .fsd:root [fill="#6366f1"] { fill: #818cf8 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#d97706"], .fsd:root [fill="#d97706"] { fill: #fbbf24 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#e11d48"], .fsd:root [fill="#e11d48"] { fill: #fb7185 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [fill="#475569"], .fsd:root [fill="#475569"] { fill: #94a3b8 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#f3f4f6"], .fsd:root [stroke="#f3f4f6"] { stroke: #1f2430 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#fff"], .fsd:root [stroke="#fff"] { stroke: #11141b }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#374151"], .fsd:root [stroke="#374151"] { stroke: #e5e7eb }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#888"], .fsd:root [stroke="#888"] { stroke: #9ca3af }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#9ca3af"], .fsd:root [stroke="#9ca3af"] { stroke: #6b7280 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#6366f1"], .fsd:root [stroke="#6366f1"] { stroke: #818cf8 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#d97706"], .fsd:root [stroke="#d97706"] { stroke: #fbbf24 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#e11d48"], .fsd:root [stroke="#e11d48"] { stroke: #fb7185 }
      :root:not([data-theme="light"]):not([data-theme="dark"]):not([data-theme="ayu"]) .fsd [stroke="#475569"], .fsd:root [stroke="#475569"] { stroke: #94a3b8 }
    }
  </style>
  <defs>
    <marker id="fs-states-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
  </defs>
  <rect x="0" y="0" width="860" height="725" rx="12" fill="#f3f4f6"/>
  <text x="430" y="32" text-anchor="middle" font-family="'Space Mono', monospace" font-size="13" fill="#6366f1">Entity state (BaoFileStorage)</text>
  <!-- states -->
  <g font-family="'Space Mono', monospace" text-anchor="middle">
    <rect x="80" y="130" width="150" height="50" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="155" y="151" font-size="12" fill="#374151">Initial</text>
    <text x="155" y="168" font-size="10" fill="#888">not loaded</text>
    <rect x="355" y="130" width="150" height="50" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="430" y="151" font-size="12" fill="#374151">Loading</text>
    <text x="430" y="168" font-size="10" fill="#888">Get in flight</text>
    <rect x="630" y="130" width="150" height="50" rx="8" fill="#fff" stroke="#e11d48" stroke-width="1.2"/>
    <text x="705" y="151" font-size="12" fill="#374151">Poisoned</text>
    <text x="705" y="168" font-size="10" fill="#888">IO error, or persisted</text>
    <rect x="80" y="330" width="150" height="50" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="155" y="351" font-size="12" fill="#374151">NonExisting</text>
    <text x="155" y="368" font-size="10" fill="#888">no entry</text>
    <rect x="355" y="330" width="150" height="50" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="430" y="351" font-size="12" fill="#374151">Partial</text>
    <text x="430" y="368" font-size="10" fill="#888">files, some ranges</text>
    <rect x="630" y="330" width="150" height="50" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="705" y="351" font-size="12" fill="#374151">Complete</text>
    <text x="705" y="368" font-size="10" fill="#888">writes are no-ops</text>
    <rect x="80" y="530" width="150" height="50" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="155" y="551" font-size="12" fill="#374151">Deleting</text>
    <text x="155" y="568" font-size="10" fill="#888">no entry, writes wait</text>
    <rect x="630" y="530" width="150" height="50" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="705" y="551" font-size="12" fill="#374151">Frozen(S)</text>
    <text x="705" y="568" font-size="10" fill="#888">reads see S, writes wait</text>
  </g>
  <!-- the loaded states -->
  <rect x="66" y="318" width="728" height="76" rx="10" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="74" y="312" font-family="'Space Mono', monospace" font-size="10" fill="#888">loaded</text>
  <!-- transitions -->
  <g fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#fs-states-arrow)">
    <!-- start: a new or recycled entity -->
    <path d="M51,155 H78"/>
    <!-- Initial to Loading -->
    <path d="M230,155 H353"/>
    <!-- Loading to Poisoned -->
    <path d="M505,155 H628"/>
    <!-- Poisoned to Initial: recycled -->
    <path d="M705,128 C705,70 155,70 155,128"/>
    <!-- Loading to NonExisting, Partial, Complete -->
    <path d="M380,180 L201,328"/>
    <path d="M430,180 V328"/>
    <path d="M480,180 L659,328"/>
    <!-- Poisoned to Complete: finish_import -->
    <path d="M705,180 V328"/>
    <!-- NonExisting to Partial, Partial to Complete -->
    <path d="M230,355 H353"/>
    <path d="M505,355 H628"/>
    <!-- NonExisting to Complete -->
    <path d="M222,380 C222,450 680,450 680,382"/>
    <!-- loaded to Deleting, Deleting to NonExisting -->
    <path d="M110,394 V528"/>
    <path d="M190,530 V382"/>
    <!-- loaded to Frozen, and back -->
    <path d="M730,394 V528"/>
    <path d="M760,530 V396"/>
  </g>
  <circle cx="45" cy="155" r="6" fill="#6366f1"/>
  <g font-family="'Space Mono', monospace" font-size="11" fill="#6366f1" text-anchor="middle">
    <text x="292" y="147">load</text>
    <text x="567" y="147">open fails</text>
    <text x="430" y="78">reset, when recycled</text>
    <text x="283" y="248" text-anchor="end">[no entry]</text>
    <text x="438" y="258" text-anchor="start">[partial]</text>
    <text x="578" y="248" text-anchor="start">[complete]</text>
    <text x="713" y="258" text-anchor="start">finish_import</text>
    <text x="292" y="347">write_batch</text>
    <text x="292" y="373" fill="#888" font-size="10">[not complete]</text>
    <text x="567" y="333">write_batch</text>
    <text x="567" y="347" fill="#888" font-size="10">[complete]</text>
    <text x="567" y="373">finish_import</text>
    <text x="104" y="465" text-anchor="end">delete_entry</text>
    <text x="104" y="480" text-anchor="end" fill="#888" font-size="10">count + 1</text>
    <text x="198" y="480" text-anchor="start">FileNotice</text>
    <text x="198" y="495" text-anchor="start" fill="#888" font-size="10">unlink all four</text>
    <text x="722" y="480" text-anchor="end">freeze_entry</text>
    <text x="722" y="495" text-anchor="end" fill="#888" font-size="10">gc enter, HashSeq roots</text>
    <text x="768" y="480" text-anchor="start">unfreeze</text>
    <text x="768" y="495" text-anchor="start" fill="#888" font-size="10">gc exit</text>
    <text x="451" y="452">write_batch <tspan fill="#888" font-size="10">[complete]</tspan>, finish_import</text>
  </g>
  <!-- notes -->
  <g font-family="'Space Mono', monospace" font-size="10.5" fill="#d97706">
    <text x="80" y="612">IO error in write_batch: any state to Poisoned.</text>
    <text x="80" y="628">on_shutdown: persist writes a Partial's bitfield and leaves Poisoned.</text>
    <text x="80" y="644">PartialMem only exists inside one write_batch call.</text>
    <text x="80" y="660">delete_entry also starts from Initial and Poisoned. A metadata error</text>
    <text x="80" y="676">during a delete poisons the entity and aborts the store, no rollback.</text>
    <text x="80" y="692">Loading, Deleting, Frozen make writes, imports and deletes wait</text>
    <text x="80" y="708">(wait_writable). Reads only wait for Loading and Deleting (wait_settled).</text>
  </g>
</svg>
