[package]
name = "iroh-blobs-testkit"
version = "0.103.1"
edition = "2021"
description = "Protocol level conformance tests for iroh-blobs store implementations"
license = "MIT OR Apache-2.0"
authors = ["n0 team"]
repository = "https://github.com/n0-computer/iroh-blobs"
keywords = ["iroh", "blobs", "testing", "conformance"]
# Keep in sync with iroh-blobs
rust-version = "1.91"

[dependencies]
anyhow = "1.0.100"
bao-tree = { version = "0.16", default-features = false }
bytes = "1"
iroh-blobs = { path = "..", version = "=0.103.1", default-features = false }
irpc = { version = "0.17.0", default-features = false }
libtest-mimic = "0.8.1"
n0-future = "0.3.0"
proptest = "1.6.0"
range-collections = "0.4.6"
tempfile = "3.17.1"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
iroh-blobs = { path = "..", features = ["fs-store", "rpc"] }
irpc = { version = "0.17.0", features = ["rpc", "noq_endpoint_setup"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "time"] }

# The conformance cases run with libtest-mimic, see `Testkit::main`.
[[test]]
name = "mem"
harness = false

[[test]]
name = "fs"
harness = false

[[test]]
name = "fs_rpc"
harness = false

[[test]]
name = "mem_gc"
harness = false

[[test]]
name = "fs_gc"
harness = false
